name: Update news
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # AUTO_PUBLISH=true (repo variable): publish directly, no review
      - name: Publish directly
        if: vars.AUTO_PUBLISH == 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Update news" && git push)
      # Default: open a pull request; merging it = approval
      - name: Open pull request for review
        if: vars.AUTO_PUBLISH != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: news.json
          commit-message: Update news
          title: News update for review
          branch: news-update
          delete-branch: true
